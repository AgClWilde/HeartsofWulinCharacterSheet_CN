<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武林之心角色卡 · 标准人物模板</title>
<style>
:root{
  --red:#9E0000; --red2:#A03030; --red3:#B03040; --red4:#C00000;
  --ink:#2A2A2A; --line:#D9B8B8; --bg:#FFF9F7; --card:#FFFFFF;
  --gray:#6B6B6B; --darkred:#7A0000;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); padding:16px 12px 40px;}
.wrap{max-width:1060px; margin:0 auto;}

/* ===== 顶部工具栏 ===== */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.brand{font-size:20px; font-weight:700; color:var(--red); letter-spacing:2px;}
.brand small{font-size:12px; color:var(--red2); font-weight:400; letter-spacing:0; margin-left:6px;}
.toolbar .btns{margin-left:auto; display:flex; gap:8px;}
.btn{border:1.5px solid var(--red); background:#fff; color:var(--red); padding:6px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;}
.btn:hover{background:#FBE9E9;}
.btn.solid{background:var(--red); color:#fff;}
.btn.solid:hover{background:var(--darkred);}

/* ===== 角色 Tab ===== */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.tab{padding:8px 18px; border-radius:8px 8px 0 0; border:1.5px solid var(--red2); border-bottom:none;
  background:#fff; color:var(--red2); font-size:15px; font-weight:700; cursor:pointer; letter-spacing:2px;}
.tab:hover{background:#FBE9E9;}
.tab.on{background:var(--red); color:#fff;}

/* ===== 角色卡 ===== */
.card{background:var(--card); border:2px solid var(--red); border-radius:4px; padding:20px 22px; box-shadow:0 2px 10px rgba(158,0,0,.08);}

/* 卡头 */
.card-head{display:flex; gap:18px; align-items:stretch; border-bottom:2px solid var(--red); padding-bottom:14px; margin-bottom:14px;}
.badge{flex:0 0 92px; background:var(--red); color:#fff; font-size:38px; font-weight:700; border-radius:6px;
  display:flex; align-items:center; justify-content:center; letter-spacing:2px; line-height:1.05; padding:8px 0;}
.head-txt{flex:1;}
.head-txt .intro{font-size:13px; line-height:1.7; color:var(--ink);}
.head-txt .rules{margin-top:6px; font-size:12.5px; line-height:1.6; color:var(--red3);}
.head-txt .rules b{color:var(--red);}

/* 基本信息 */
.info-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px;}
.info-grid .fld label{display:block; font-size:12px; font-weight:700; color:var(--red2); margin-bottom:3px; letter-spacing:1px;}
.info-grid .fld input{width:100%; border:1.5px solid var(--line); border-radius:4px; padding:6px 8px; font-size:14px; color:var(--ink); background:#fff;}
.info-grid .fld input:focus{outline:none; border-color:var(--red);}
.info-grid .fld select{width:100%; border:1.5px solid var(--line); border-radius:4px; padding:6px 8px; font-size:14px; color:var(--red); background:#fff; font-weight:600;}
.info-grid .fld select:focus{outline:none; border-color:var(--red);}

/* 主区两栏（等高，末块自适应填满，左右底部对齐） */
.main-grid{display:grid; grid-template-columns:1.02fr 1fr; gap:18px; margin-bottom:14px; align-items:stretch;}
.col{min-width:0; display:flex; flex-direction:column;}
.col .block{flex:0 0 auto;}
.col .block:last-child{flex:1 1 auto; display:flex; flex-direction:column;}
.col .block:last-child .block-body{flex:1 1 auto; display:flex; flex-direction:column;}
.block{border:1.5px solid var(--red2); border-radius:6px; margin-bottom:14px; overflow:hidden;}
.block-title{background:var(--red); color:#fff; font-size:14.5px; font-weight:700; padding:6px 12px; letter-spacing:2px;}
.block-body{padding:10px 12px;}

/* 背景选项 */
.bg-item{display:flex; gap:8px; align-items:flex-start; padding:7px 4px; border-bottom:1px dashed var(--line);}
.bg-item:last-child{border-bottom:none;}
.ck{flex:0 0 auto; font-size:17px; cursor:pointer; color:var(--red); user-select:none; line-height:1.3; width:20px; text-align:center;}
.bg-item .bg-name{font-size:13.5px; font-weight:700; color:var(--red); white-space:nowrap; padding-top:1px;}
.bg-item .bg-desc{font-size:12.5px; line-height:1.65; color:var(--ink);}

/* 模板行动 */
.act-item{display:flex; gap:8px; align-items:flex-start; padding:7px 4px; border-bottom:1px dashed var(--line);}
.act-item:last-child{border-bottom:none;}
.act-item .act-name{font-size:13px; font-weight:700; color:var(--red2); white-space:nowrap; padding-top:1px;}
.act-item .act-desc{font-size:12.5px; line-height:1.65; color:var(--ink); white-space:pre-wrap;}

/* 五行（元素名 | 数值 | 圆球 | 简介，简介列自适应宽度避免右侧留白） */
.elem-row{display:grid; grid-template-columns:52px 52px 60px auto auto; gap:8px; align-items:center; padding:6px 2px; border-bottom:1px dashed var(--line);}
.elem-row:last-child{border-bottom:none;}
.elem-name{font-size:17px; font-weight:700; text-align:center;}
.elem-name.tu{color:#7F6000;}
.elem-name.huo{color:#C00000;}
.elem-name.jin{color:#F4B183;}
.elem-name.shui{color:#8FAADC;}
.elem-name.mu{color:#548235;}
.elem-adj select{width:100%; border:1.5px solid var(--line); border-radius:4px; padding:3px 2px; font-size:12.5px; color:var(--red); font-weight:700; background:#fff;}
.elem-adj select:focus{outline:none; border-color:var(--red);}
.elem-dot{font-size:17px; cursor:pointer; color:var(--red); text-align:center; user-select:none; margin-left:20px;}
.elem-words{font-size:12px; line-height:1.55;}
.elem-words .pos{color:var(--ink); font-weight:600;}
.elem-words .neg{color:var(--red3);}
.style-tag{font-size:11px; color:#fff; background:var(--red); border-radius:3px; padding:2px 7px; white-space:nowrap; letter-spacing:1px;}
/* 整行标记后灰化（"不能使用"） */
.elem-row.marked{opacity:0.45; background:#F0F0F0;}
.elem-row.marked .elem-name,
.elem-row.marked .elem-words .pos,
.elem-row.marked .elem-words .neg{color:#888 !important;}
.elem-row.marked .elem-adj select{background:#E5E5E5 !important; color:#888 !important; border-color:#CCC !important; cursor:not-allowed;}
.elem-row.marked .elem-dot{cursor:pointer;}

/* 自拟行动（红底白字标题行分隔，融入原框） */
.act-custom{margin-top:10px; border-top:1.5px solid var(--red2); flex:1 1 auto; display:flex; flex-direction:column;}
.act-custom-label{display:inline-block; background:var(--red); color:#fff; font-size:12.5px; font-weight:700; padding:4px 14px; letter-spacing:2px; border-radius:0 0 6px 0;}
.act-custom-text{width:100%; border:none; resize:vertical; min-height:88px; padding:7px 8px; font-size:12.5px; line-height:1.65; color:var(--ink); background:transparent; font-family:inherit; flex:1 1 auto;}
.act-custom-text:focus{outline:none;}

/* 纠葛 */
.ent-area{border:1.5px solid var(--line); border-radius:4px; margin-bottom:8px; overflow:hidden; flex:1 1 auto; display:flex; flex-direction:column;}
.ent-area:last-child{margin-bottom:0;}
.ent-head{display:flex; align-items:center; gap:10px; background:#FDF3F1; padding:5px 10px; border-bottom:1px solid var(--line);}
.ent-name{font-size:13.5px; font-weight:700; color:var(--red); letter-spacing:1px;}
.ent-focus{font-size:11.5px; color:var(--red3);}
.ent-text{width:100%; border:none; resize:vertical; min-height:64px; padding:8px 10px; font-size:13px; line-height:1.65; color:var(--ink); background:#fff; font-family:inherit; flex:1 1 auto;}
.ent-text:focus{outline:none; background:#FFF7F4;}

/* 底部三栏 */
.bottom-grid{display:grid; grid-template-columns:180px 1fr 1.25fr; gap:18px;}
.mini-title{background:var(--red2); color:#fff; font-size:13.5px; font-weight:700; padding:5px 10px; border-radius:4px; letter-spacing:2px; margin-bottom:8px;}
.wound-row{display:flex; align-items:center; gap:10px;}
.wound-row .ck{font-size:20px;}
.wound-txt{font-size:13px; color:var(--ink);}
.wound-txt b{color:var(--red); font-size:14px;}

.fate-table{width:100%; border-collapse:collapse;}
.fate-table td{border:1.5px solid var(--line); padding:2px;}
.fate-table input{width:100%; border:none; padding:5px 6px; font-size:13px; color:var(--ink); background:transparent;}
.fate-table input:focus{outline:none; background:#FFF3F0;}
.fate-table td.del{width:26px; text-align:center;}
.fate-table .del-btn{background:none; border:none; color:var(--red3); cursor:pointer; font-size:14px; padding:2px 4px;}
.fate-table .del-btn:hover{color:var(--red);}
.add-row{display:inline-block; margin-top:6px; border:1px dashed var(--red2); color:var(--red2); background:#fff; border-radius:4px;
  padding:3px 12px; font-size:12px; cursor:pointer;}
.add-row:hover{background:#FBE9E9;}

.xp-trig{list-style:none;}
.xp-trig-item{display:flex; gap:8px; align-items:center; padding:4px 0; font-size:12.5px; line-height:1.55;}
.xp-trig-txt{flex:1;}
.counter{display:flex; align-items:center; gap:3px; flex:0 0 auto;}
.cnt-btn{width:20px; height:20px; border:1.5px solid var(--red2); background:#fff; color:var(--red); border-radius:4px; cursor:pointer; font-size:14px; line-height:1; padding:0;}
.cnt-btn:hover{background:#FBE9E9;}
.cnt-input{width:46px; border:1.5px solid var(--line); border-radius:4px; padding:2px 2px; font-size:12.5px; text-align:center; color:var(--red); font-weight:700; background:#fff;}
.cnt-input:focus{outline:none; border-color:var(--red);}
.cnt-input::-webkit-outer-spin-button,
.cnt-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.cnt-input{-moz-appearance:textfield;}
.xp-bar{display:flex; align-items:center; gap:8px; margin:8px 0 4px;}
.xp-label{font-size:13px; font-weight:700; color:var(--red);}
.xp-dots{display:flex; gap:3px; flex:1;}
.dot{font-size:16px; cursor:pointer; color:#CBB; user-select:none; transition:color .1s;}
.dot.on{color:var(--red);}
.growth-item{display:flex; gap:8px; align-items:flex-start; padding:4px 0; border-bottom:1px dashed var(--line);}
.growth-item:last-child{border-bottom:none;}
.growth-dots{white-space:nowrap; padding-top:2px;}
.growth-dots .dot{font-size:14px;}
.growth-item .gtxt{font-size:12.5px; line-height:1.5; color:var(--ink);}

.foot-note{margin-top:12px; font-size:11px; color:var(--gray); text-align:right;}

@media (max-width:900px){
  .main-grid,.bottom-grid{grid-template-columns:1fr;}
  .info-grid{grid-template-columns:repeat(2,1fr);}
}
@media print{
  body{background:#fff; padding:0;}
  .toolbar,.tabs,.add-row,.fate-table .del-btn{display:none !important;}
  .card{border-width:1.5px; box-shadow:none;}
  @page{size:A4; margin:10mm;}
  .main-grid,.bottom-grid{page-break-inside:avoid;}
  .block{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="brand">武林之心角色卡<small>标准人物模板</small></div>
    <div class="btns">
      <button class="btn solid" onclick="window.print()">打印 / 存 PDF</button>
      <button class="btn" id="btnJpg" onclick="exportJpg()">生成 JPG</button>
      <button class="btn" onclick="resetCard()">重置当前角色</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="card"></div>
</div>

<script>
/* ================= 角色数据（取自 6 张 Excel 标准人物模板） ================= */
const CARDS = [
{
  "id": "yishi",
  "cn": "义士",
  "name": "义士",

  "rules": "玩家守则：坚守本心；含蓄地表达内心；参与每个人的纠葛；为大局行动；展现责任与自我之间的冲突。",
  "backgrounds": [
    {"name":"孝廉","desc":"你忠于家族，家族也在背后支持你。每场团务，你可以动用一次家族人情：一封介绍信、进入一次私人聚会的许可、为一项大胆计划提供助力，等等。但他们可能会要求你帮忙或对你有其他期望。"},
    {"name":"官员","desc":"你是一名地方官员、按察使或朝堂官吏，拥有一定权威。你有暗中向你通风报信、提供协助的线人选择一种线人类型：街头乞丐、朝堂门客、某一派系成员等。只要不需要他们付出代价或者陷入险境，他们总是愿意给你提供基本信息和一点小帮助。若是难以获取的信息或需要他们涉险，你必须向他们提供他们想要的回报。"},
    {"name":"剑客","desc":"武林中人皆习武艺，但鲜有人如你这般倾心竭力。你誓在成为盖世侠客，以此报效家族和宗门。你有一个额外的负伤槽。当你标记第一次“负伤”时，你虽流血受伤，却不承受任何惩罚。你在标记第二次“负伤”时，你承受 -2 持续。"}
  ],
  "actions": [
    {"name":"天外飞仙","desc":"当在【一决高下】中，你对实力弱于你的敌人掷出成功，或对实力相当的敌人掷出 7-9 时，在其他选择之外，你还可以追加一项效果：大幅改变战斗地点。你可以将对手逼入附近区域，例如把他们逼出窗外、与你一同坠下悬崖，或将战斗带到别的地方等。"},
    {"name":"飞刀有情","desc":"你可以花费与某人的一点缘分，立即出现在此人的所在地。如果你同意，其他人也可以花费一点和你的缘分，让你在关键时刻出现。描述你是如何凑巧地及时抵达。"},
    {"name":"倚天屠龙","desc":"你拥有一把传奇兵刃，所至之处无人不识。当使用【以寡敌众】或对武林中人使用【技惊四座】时，你获得 +1 加值。"},
    {"name":"义结金兰","desc":"当你对盟友使用【同舟共济】，并立即花费你刚创造的缘分点时，给对方 +2 而非 +1 加值。"},
    {"name":"快意恩仇","desc":"当你发现有人对你说谎，或违背对你的承诺时，你获得与他们的 1 个缘分点。除了缘分的通常用途外，你还可以消耗此缘分点，使他们的某个计划或行动出现差错，并描述发生的事情。若你在针对他们的行动掷骰中消耗此缘分点，则获得 +2 修正。"},
    {"name":"泰山可倚","desc":"当你守卫某人或某事时，掷骰，成功时，你成功护住他们，并从以下选项中选择其一：掌控某事；改变冲突发生的地点；获得与被守护之人的一点缘分。\n当掷骰结果为 7-9 时，你还必须标记一项五行属性（自选），或让 GM 把局势变得更复杂。\n失败时，你的努力反使守护的对象或他人情况更糟。"},
    {"name":"只手遮天","desc":"当你凭借 NPC 认可的权威给对方下命令时，掷骰。成功时，他们选择其一：服从、让步、发起孱弱的攻击，或不知所措。结果为 10 或以上 时，再指定一个对方无法选择的选项，并在对抗此人时获得 +1 次骰。失败时，选择：标记一项五行属性，或某位重要人物认为你越权行事。"},
    {"name":"望尘追迹","desc":"当你追索某人，掷骰。成功时，你准确知晓他们的所在，并能够一路追踪直到找到他们。当掷骰结果为 10 或以上时，对方没有察觉你，且你在针对他们时获得 +1 次骰。失败时，在你找到他们之前，一个不受欢迎的人先找到了你。"}
  ]
},
{
  "id": "xuesheng",
  "cn": "学生",
  "name": "学生",
  "intro": "选择此模板，如果你：想在充斥腐败和虚假的复杂世界中成为一名赤子，通过你的问题揭示真相。",
  "rules": "玩家守则：坚守本心；含蓄地表达内心；参与每个人的纠葛；为大局行动；尽享天真烂漫。",
  "backgrounds": [
    {"name":"有志之徒","desc":"你必须证明自己的天赋与实力。当你与实力高于你的对手交战时，你不会立刻落败。你可以标记一项五行属性来缠住显然强于你的敌手，给其他人机会去执行其他行动、保护他人或取得此行所求之物。如果你这么做是为了掩护队伍撤退，那么包括你在内的全员都能安全逃走。"},
    {"name":"行脚僧","desc":"你出身寺庙，因自身或他人的意愿入世游历红尘。只要你穿着僧衣，当地人都会对你以礼相待，连强盗对你下手亦要三思。在旅途中，你可以寻求并获得食宿招待。"},
    {"name":"少侠","desc":"纵使身处逆境，你仍然明白何为忠诚与奉献。当你消耗 1 点缘分点来获取判定加值时，加值由 +1 提升至 +2。"}
  ],
  "actions": [
    {"name":"侠骨仁心","desc":"当你试图感化反派阵营中一名有价值的效忠者，改变其立场或意图时，掷骰。当掷骰结果为 10 或以上时，你的话直抵对方内心。他们会立刻采取行动协助你，或随你而去，或去直面原主，或逃离此地。当掷骰结果为 7-9 时，你的话令对方产生了动摇。你可以自主选择是在其心中埋下怀疑的种子，或者是让其在无意间做出有利于你的举动。失败时，对方假装回心转意来愚弄你。"},
    {"name":"天命在我","desc":"在每次团务开始时，掷不加任何五行属性修正的 2d6。当掷骰结果为 6 或以下时，标记 1 点 XP，GM 获得一个源于命运的柔和行动机会，可在之后启用。成功时，记下这个掷骰结果。在本次团务的任何时刻，你都可以将该结果与自己或盟友的掷骰结果进行替换。替换后，由你或你的盟友加上对应的五行属性调整值，照常结算判定。被替换掉的结果作废，无法产生 XP。若到本次团务结束时仍未动用，该结果自动失效。"},
    {"name":"早有定见","desc":"你虽然经验不足，却独重明智之见。当你向另一位 PC 提供建议，对方不予采纳时，若其之后自招麻烦，你在营救对方时获得 +1 持续。"},
    {"name":"求师问典","desc":"当你向长辈寻求指点时，无论是在当下还是通过闪回，告诉对方你面临的挑战，然后掷骰。成功时，对方会为你指明方向。当掷骰结果为 10 或以上时，对方还会透露他们与这个难题之间的隐秘关联。若你听从长辈的建议，针对该难题获得 +1 持续。如果你自行其是，则标记 1 点 XP。失败时，对方因惊变而无暇顾及你，标记一项五行属性。"},
    {"name":"春风化雨","desc":"在有人出丑或冒犯他人后，掷骰。成功时，如果这仅仅是剧情描写，你可以将对方说出的话语修饰得更委婉些；如果这是一个失败的行动，你可以将 GM 的强硬行动弱化为柔和行动。当掷骰结果为 10 或以上时，视情况而定，你甚至能让此事被彻底揭过。失败时，你让这次冒犯变得更加严重了。"},
    {"name":"痛定思痛","desc":"当你标记负伤槽时，所有队友获得 +1 次骰。"},
    {"name":"乳虎窥世","desc":"这是你见识和领略大千世界的机会。每个场景一次，你可以直接询问【洞若观火】中的一项问题，无需掷骰。"},
    {"name":"顺势而为","desc":"当你在冲突局势中使用【同舟共济】来清除一名盟友的负伤槽时，你还可以额外清除某人（包括你自己）身上的一项五行属性标记。"}
  ]
},
{

];
const FOCUS = ["通常","浪漫"];   /* 两个纠葛大区，每区含「聚焦」标记 */
const XP_TRIGGERS = ["在冲突中落败","在【不情之请】中接受另一名 PC 的建议","为【天人交战】掷骰","与纠葛产生重要互动","与聚焦纠葛产生重要互动"];
const GROWTH = [
  {dots:5, txt:"选择一项五行属性，调整值 +1"},
  {dots:3, txt:"从此模板中获得一个行动"},
  {dots:2, txt:"从其他模板中获得一个行动"},
  {dots:2, txt:"获得一个自拟行动"}
];

/* ================= 状态管理 ================= */
const KEY = "wuxia_card_";
let cur = CARDS[0].id;
let S = {};  // S[id] = state

function defState(){
  return {
    inputs:{name:"",look:"",style:"",attr:"",weapon:""},
    bg:new Array(CARDS[0].backgrounds.length).fill(false),
    act:new Array(CARDS[0].actions.length).fill(false),
    elem:new Array(5).fill(false),
    adj:["0","0","0","0","0"],
    focus:new Array(2).fill(false),
    ent:["",""],
    wound:false,
    xp:0,
    xpTrig:new Array(5).fill(0),
    growth:new Array(4).fill(0),
    customAct:"",
    fate:[{name:"",val:""},{name:"",val:""},{name:"",val:""},{name:"",val:""},{name:"",val:""}]
  };
}
function save(){
  try{ localStorage.setItem(KEY+cur, JSON.stringify(S[cur])); }catch(e){}
}
function load(id){
  try{
    const raw = localStorage.getItem(KEY+id);
    if(!raw) return defState();
    const d = JSON.parse(raw), st = defState();
    Object.assign(st, d);
    st.focus = [!!d.focus[0], !!d.focus[1]];
    st.ent = [d.ent ? d.ent[0] || "" : "", d.ent ? d.ent[1] || "" : ""];
    st.customAct = d.customAct || "";
    st.xpTrig = [0,1,2,3,4].map(k=>{ const v=d.xpTrig[k]; return (typeof v==="number")?v:(v?1:0); });
    let bgFound = false;
    st.bg = st.bg.map(v=>{ if(v&&!bgFound){ bgFound=true; return true; } return false; });
    return st;
  }catch(e){ return defState(); }
}

/* ================= 渲染 ================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function dotHtml(n, val, row){
  let h = "";
  for(let i=0;i<n;i++) h += '<span class="dot '+(i<val?"on":"")+'" data-i="'+i+'">'+(i<val?"●":"○")+'</span>';
  return '<span class="'+(row!==undefined?"growth-dots":"xp-dots")+'"'+(row!==undefined?' data-grow="'+row+'"':"")+'>'+h+'</span>';
}

function renderTabs(){
  const box = document.getElementById("tabs");
  box.innerHTML = CARDS.map(c =>
    '<div class="tab '+(c.id===cur?"on":"")+'" data-id="'+c.id+'">'+esc(c.name)+'</div>'
  ).join("");
}

function renderCard(){
  const c = CARDS.find(x=>x.id===cur);
  const st = S[cur];
  // 输入框字段数量对齐（学生卡等每卡相同 5 个字段）
  while(st.inputs && Object.keys(st.inputs).length<5){}
  const flds = [
    ["name","姓名"],["look","外观"],["style","武学风格"],["attr","武学风格属性"],["weapon","武器"]
  ];
  const infoHtml = flds.map(([k,label])=>{
    if(k==="attr"){
      return '<div class="fld"><label>'+label+'</label><select data-k="attr">'+
        ['','土','火','金','水','木'].map(v=>'<option value="'+v+'"'+(((st.inputs||{}).attr===v)?" selected":"")+'>'+(v||"— 选择 —")+'</option>').join("")+
      '</select></div>';
    }
    return '<div class="fld"><label>'+label+'</label><input data-k="'+k+'" value="'+esc((st.inputs||{})[k]||"")+'"></div>';
  }).join("");

  const bgHtml = c.backgrounds.map((b,i)=>
    '<div class="bg-item"><span class="ck" data-g="bg" data-i="'+i+'">'+(st.bg[i]?"●":"○")+'</span>'+
    '<span class="bg-name">'+esc(b.name)+'</span><span class="bg-desc">'+esc(b.desc)+'</span></div>'
  ).join("");

  const actHtml = c.actions.map((a,i)=>
    '<div class="act-item"><span class="ck" data-g="act" data-i="'+i+'">'+(st.act[i]?"☑":"☐")+'</span>'+
    '<span class="act-name">'+esc(a.name)+'</span><span class="act-desc">'+esc(a.desc)+'</span></div>'
  ).join("") +
  '<div class="act-custom"><div class="act-custom-label">自拟行动</div>'+
  '<textarea class="act-custom-text" data-custom placeholder="在此添加自拟行动…">'+esc(st.customAct||"")+'</textarea></div>';

  const elemHtml = ELEMENTS.map((e,i)=>{
    const styleTag = (st.inputs.attr===e.name) ? '<span class="style-tag">武学风格属性</span>' : '';
    return '<div class="elem-row'+(st.elem[i]?" marked":"")+'"><span class="elem-name '+e.cls+'">'+e.name+'</span>'+
    '<span class="elem-adj"><select data-g="adj" data-i="'+i+'"'+(st.elem[i]?' disabled':'')+'>'+
      ['+2','+1','0','-1'].map(v=>'<option value="'+v+'"'+(st.adj[i]===v?" selected":"")+'>'+v+'</option>').join("")+
    '</select></span>'+
    '<span class="elem-dot ck" data-g="elem" data-i="'+i+'">'+(st.elem[i]?"●":"○")+'</span>'+
    '<span class="elem-words"><span class="pos">'+e.pos+'</span><br><span class="neg">'+e.neg+'</span></span>'+
    styleTag+
    '</div>';
  }).join("");

  const focusHtml = FOCUS.map((f,i)=>
    '<div class="ent-area"><div class="ent-head"><span class="ent-name">'+f+'</span>'+
    '<span class="ent-focus">聚焦</span>'+
    '<span class="ck" data-g="focus" data-i="'+i+'">'+(st.focus[i]?"●":"○")+'</span></div>'+
    '<textarea class="ent-text" data-ent="'+i+'" placeholder="填写'+f+'纠葛…">'+esc(st.ent[i]||"")+'</textarea></div>'
  ).join("");

  const fateRows = st.fate.map((r,i)=>
    '<tr><td><input data-f="name" data-i="'+i+'" value="'+esc(r.name)+'" placeholder="名称"></td>'+
    '<td style="width:120px"><input data-f="val" data-i="'+i+'" value="'+esc(r.val)+'" placeholder="数值"></td>'+
    '<td class="del"><button class="del-btn" data-del="'+i+'" title="删除此行">×</button></td></tr>'
  ).join("");

  const trigHtml = XP_TRIGGERS.map((t,i)=>
    '<li class="xp-trig-item"><span class="xp-trig-txt">'+t+'</span>'+
    '<span class="counter">'+
      '<button class="cnt-btn" data-cnt="dec" data-i="'+i+'" title="减一次">−</button>'+
      '<input class="cnt-input" type="number" min="0" max="99" value="'+(st.xpTrig[i]||0)+'" data-cnt="in" data-i="'+i+'">'+
      '<button class="cnt-btn" data-cnt="inc" data-i="'+i+'" title="加一次">＋</button>'+
    '</span></li>'
  ).join("");

  const growthHtml = GROWTH.map((g,i)=>
    '<div class="growth-item">'+dotHtml(g.dots, st.growth[i], i)+'<span class="gtxt">'+g.txt+'</span></div>'
  ).join("");

  document.getElementById("card").innerHTML =
  '<div class="card-head">'+
    '<div class="badge">'+esc(c.name)+'</div>'+
    '<div class="head-txt">'+
      '<div class="intro">'+esc(c.intro)+'</div>'+
      '<div class="rules">'+esc(c.rules).replace(/玩家守则：/,'<b>玩家守则：</b>')+'</div>'+
    '</div>'+
  '</div>'+
  '<div class="info-grid">'+infoHtml+'</div>'+
  '<div class="main-grid">'+
    '<div class="col">'+
      '<div class="block"><div class="block-title">原型</div><div class="block-body">'+bgHtml+'</div></div>'+
      '<div class="block"><div class="block-title">五行属性</div><div class="block-body">'+elemHtml+'</div></div>'+
      '<div class="block"><div class="block-title">纠葛</div><div class="block-body">'+focusHtml+'</div></div>'+
    '</div>'+
    '<div class="col">'+
      '<div class="block"><div class="block-title">模板行动</div><div class="block-body">'+actHtml+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="bottom-grid">'+
    '<div><div class="mini-title">负伤</div>'+
      '<div class="wound-row"><span class="ck" data-g="wound">'+(st.wound?"●":"○")+'</span><span class="wound-txt">掷骰结果 <b>-2</b></span></div>'+
    '</div>'+
    '<div><div class="mini-title">缘分</div>'+
      '<table class="fate-table">'+fateRows+'</table>'+
      '<button class="add-row" id="addFate">＋ 添加一行</button>'+
    '</div>'+
    '<div><div class="mini-title">XP 与能力成长</div>'+
      '<ul class="xp-trig">'+trigHtml+'</ul>'+
      '<div class="xp-bar"><span class="xp-label">XP</span>'+dotHtml(8, st.xp)+'</div>'+
      growthHtml+
    '</div>'+
  '</div>'+
  '<div class="foot-note">数据自动保存在本机浏览器 · 打印时自动隐藏切换栏</div>';
}

/* ================= 事件 ================= */
function toggle(g,i){
  const st=S[cur];
  let v;
  if(g==="bg"){ st.bg[i]=!st.bg[i]; for(let k=0;k<st.bg.length;k++){ if(k!==i) st.bg[k]=false; } v=st.bg[i]; }
  else if(g==="act"){ v=st.act[i]=!st.act[i]; }
  else if(g==="elem"){ v=st.elem[i]=!st.elem[i]; }
  else if(g==="focus"){ v=st.focus[i]=!st.focus[i]; }
  else if(g==="wound"){ v=st.wound=!st.wound; }
  save();
  return v;
}
function setDots(g,i,val){
  const st=S[cur];
  if(g==="xp") st.xp = (st.xp===val?0:val);
  else if(g==="growth") st.growth[i] = (st.growth[i]===val?0:val);
  save();
}

document.addEventListener("click", function(e){
  const t = e.target;
  // 角色切换
  if(t.classList && t.classList.contains("tab")){
    S[cur]=S[cur]; save();
    cur = t.getAttribute("data-id");
    S[cur] = S[cur] || load(cur);
    renderTabs(); renderCard();
    return;
  }
  // 勾选框（按类型显示：方框类 ☐☑，圆球类 ○●；原型/五行/负伤需整卡刷新）
  if(t.classList && t.classList.contains("ck")){
    const g = t.getAttribute("data-g"), i = t.getAttribute("data-i");
    const val = toggle(g, i!==null?parseInt(i):null);
    if(g==="wound" || g==="bg" || g==="elem"){ renderCard(); }
    else if(g==="act" || g==="xpTrig"){ t.textContent = val ? "☑" : "☐"; }
    else { t.textContent = val ? "●" : "○"; }
    return;
  }
  // 圆点填充
  if(t.classList && t.classList.contains("dot")){
    const bar = t.parentElement;
    const idx = parseInt(t.getAttribute("data-i"));
    if(bar.classList.contains("xp-dots")){
      setDots("xp", idx, idx+1);
    }else{
      const row = parseInt(bar.getAttribute("data-grow"));
      setDots("growth", row, idx+1);
    }
    renderCard();
    return;
  }
  // 缘分加行
  if(t.id==="addFate"){
    S[cur].fate.push({name:"",val:""}); save(); renderCard(); return;
  }
  // 缘分删行
  if(t.classList && t.classList.contains("del-btn")){
    const i = parseInt(t.getAttribute("data-del"));
    S[cur].fate.splice(i,1); save(); renderCard(); return;
  }
  // XP 触发计数加减
  if(t.classList && t.classList.contains("cnt-btn")){
    const i = parseInt(t.getAttribute("data-i"));
    const op = t.getAttribute("data-cnt");
    let v = S[cur].xpTrig[i] || 0;
    v = (op==="inc") ? v+1 : Math.max(0, v-1);
    S[cur].xpTrig[i] = v; save();
    const inp = document.querySelector('.cnt-input[data-i="'+i+'"]');
    if(inp) inp.value = v;
    return;
  }
});

document.addEventListener("input", function(e){
  const t = e.target;
  if(t.tagName==="INPUT" && t.hasAttribute("data-k")){
    S[cur].inputs[t.getAttribute("data-k")] = t.value; save();
  }
  if(t.tagName==="INPUT" && t.hasAttribute("data-f")){
    const i = parseInt(t.getAttribute("data-i"));
    const f = t.getAttribute("data-f");
    S[cur].fate[i][f] = t.value; save();
  }
  if(t.tagName==="TEXTAREA" && t.hasAttribute("data-ent")){
    S[cur].ent[parseInt(t.getAttribute("data-ent"))] = t.value; save();
  }
  if(t.tagName==="TEXTAREA" && t.hasAttribute("data-custom")){
    S[cur].customAct = t.value; save();
  }
  if(t.classList && t.classList.contains("cnt-input")){
    const i = parseInt(t.getAttribute("data-i"));
    let v = parseInt(t.value);
    if(isNaN(v) || v<0) v=0;
    if(v>99) v=99;
    S[cur].xpTrig[i] = v; save();
  }
});
document.addEventListener("change", function(e){
  const t = e.target;
  if(t.tagName==="SELECT" && t.getAttribute("data-g")==="adj"){
    S[cur].adj[parseInt(t.getAttribute("data-i"))] = t.value; save();
  }
  if(t.tagName==="SELECT" && t.hasAttribute("data-k")){
    S[cur].inputs[t.getAttribute("data-k")] = t.value; save(); renderCard();
  }
});

function resetCard(){
  if(!confirm("确定清空当前角色「"+CARDS.find(x=>x.id===cur).name+"」的所有填写内容？")) return;
  S[cur] = defState(); save(); renderCard();
}

/* ================= 生成 JPG ================= */
function exportJpg(){
  const btn = document.getElementById("btnJpg");
  const name = CARDS.find(x=>x.id===cur).name;
  const done = (dataUrl)=>{
    const a = document.createElement("a");
    a.download = name + " 人物卡.jpg";
    a.href = dataUrl;
    document.body.appendChild(a); a.click(); a.remove();
    btn.textContent = "生成 JPG";
  };
  const card = document.querySelector(".card");
  const opts = { pixelRatio:2, backgroundColor:"#ffffff", quality:0.92 };
  const run = ()=>{
    const p = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    p.then(()=>htmlToImage.toJpeg(card, opts)).then(done)
     .catch(()=>jpgFallback(done));
  };
  btn.textContent = "生成中…";
  if(window.htmlToImage){ run(); return; }
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js";
  s.onload = run;
  s.onerror = ()=>{ jpgFallback(done); btn.textContent = "生成 JPG"; };
  document.head.appendChild(s);
}
/* 离线回退：SVG foreignObject 原生导出 */
function jpgFallback(done){
  try{
    const card = document.querySelector(".card");
    const clone = card.cloneNode(true);
    clone.querySelectorAll("input").forEach(el=>{ el.setAttribute("value", el.value); });
    clone.querySelectorAll("textarea").forEach(el=>{ el.textContent = el.value; });
    const W = card.offsetWidth, H = card.offsetHeight;
    const styleTxt = Array.from(document.querySelectorAll("style")).map(s=>s.textContent).join("");
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><style>'+styleTxt+
      '</style><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">'+
      clone.outerHTML+'</div></foreignObject></svg>';
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement("canvas");
      cv.width = W*2; cv.height = H*2;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0,cv.width,cv.height);
      done(cv.toDataURL("image/jpeg", 0.92));
    };
    img.onerror = ()=>{ alert("生成 JPG 失败（离线且浏览器不支持导出）"); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }catch(e){ alert("生成 JPG 失败：" + e.message); }
}

/* ================= 启动 ================= */
CARDS.forEach(c=>{ S[c.id]=load(c.id); });
S[cur]=S[cur]||defState();
renderTabs(); renderCard();
</script>
